services:
  bot:
    build: .
    container_name: landau-moder
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./l10n:/app/l10n:ro
      - bot_data:/app/data
    environment:
      - TZ=UTC
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internals

  redis:
    image: redis:latest
    container_name: redis-landau-moder
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    networks:
      - internals
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: landau-moder-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - HTTP_USER=admin
      - HTTP_PASSWORD=${ME_ADMIN_PASSWORD}
    networks:
      - internals
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  bot_data:
  redis_data:

networks:
  internals:
